version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: digital_wallet_db
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet_secret
      POSTGRES_DB: digital_wallet
    ports:
      - "4000:4000"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d digital_wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
